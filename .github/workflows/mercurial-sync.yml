name: Daily Mercurial Sync

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:
    inputs:
      max_revision:
        description: 'Max Mercurial revision to sync (e.g., 12000). Leave empty for latest.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Install Mercurial
        run: |
          sudo apt update
          sudo apt install -y mercurial git python3 python3-pip
          pip3 install dulwich

      - name: Checkout mercurial-sync branch
        uses: actions/checkout@v3
        with:
          ref: mercurial-sync
          fetch-depth: 0

      - name: Clone upstream Mercurial repo
        run: |
          rm -rf upstream-hg
          hg clone https://foss.heptapod.net/zandronum/zandronum-stable upstream-hg

      - name: Fetch previous Git commits
        run: |
          git fetch origin mercurial-sync
          git checkout mercurial-sync

      - name: Convert Mercurial to Git
        run: |
          git init hg-temp-git
          cd hg-temp-git
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin
          cd ..
          # Clone fast-export and run conversion
          git clone https://github.com/frej/fast-export.git
          cd hg-temp-git
          # Restore conversion state from mercurial-sync-meta branch (if exists)
          if git show origin/mercurial-sync-meta:hg2git-heads > /dev/null 2>&1 && \
             git show origin/mercurial-sync-meta:hg2git-marks > /dev/null 2>&1 && \
             git show origin/mercurial-sync-meta:hg2git-state > /dev/null 2>&1 && \
             git show origin/mercurial-sync-meta:hg2git-mapping > /dev/null 2>&1; then
            git show origin/mercurial-sync-meta:hg2git-marks > .git/hg2git-marks
            git show origin/mercurial-sync-meta:hg2git-state > .git/hg2git-state
            git show origin/mercurial-sync-meta:hg2git-mapping > .git/hg2git-mapping
            git show origin/mercurial-sync-meta:hg2git-heads > .git/hg2git-heads
            git checkout -b mercurial-sync origin/mercurial-sync
          else
            # No state found, do fresh conversion
            git branch -D mercurial-sync 2>/dev/null || true
            git update-ref -d refs/remotes/origin/mercurial-sync 2>/dev/null || true
            rm -f .git/hg2git-marks .git/hg2git-state .git/hg2git-mapping .git/hg2git-heads
          fi
          # Some ST_* tags (0.97d-beta4.2 onwards) point to commits on unnamed Mercurial heads
          # that don't get converted. Create inline filter script.
          cat > /tmp/filter-tags.py << 'FILTER_EOF'
          import sys, re
          content = sys.stdin.buffer.read().decode('utf-8', errors='replace')
          skip_tags = [
              'ST_0.97d-beta4.2', 'ST_0.97d-beta4.3', 'ST_0.97d-RC9', 'ST_0.97d-RC10',
              'ST_0.97d', 'ST_0.97d2-RC2', 'ST_0.97d2-RC3', 'ST_0.97d2-RC6', 'ST_0.97d2',
              'ST_0.97d3-RC1', 'ST_0.97d3-RC2', 'ST_0.97d3', 'ST_0.97d3-security-update-1',
              'ST_0.97d4', 'ST_0.97d5', 'ST_0.97d5-security-update-1'
          ]
          for tag in skip_tags:
              pattern = rf'tag {re.escape(tag)}\nfrom [^\n]+\ntagger [^\n]+\ndata (\d+)\n'
              match = re.search(pattern, content)
              while match:
                  start, end = match.start(), match.end() + int(match.group(1))
                  content = content[:start] + content[end:]
                  match = re.search(pattern, content)
          sys.stdout.buffer.write(content.encode('utf-8'))
          FILTER_EOF

          # Run conversion, filter problematic tags, and import
          MAX_REV_ARG=""
          if [[ -n "${{ github.event.inputs.max_revision }}" ]]; then
            MAX_REV_ARG="--max ${{ github.event.inputs.max_revision }}"
            echo "Limiting sync to revision ${{ github.event.inputs.max_revision }}"
          fi
          python3 ../fast-export/hg-fast-export.py \
            -r ../upstream-hg \
            -M mercurial-sync \
            --force \
            --marks .git/hg2git-marks \
            --mapping .git/hg2git-mapping \
            --heads .git/hg2git-heads \
            --status .git/hg2git-state \
            $MAX_REV_ARG \
            | python3 /tmp/filter-tags.py \
            | git fast-import --import-marks-if-exists=.git/hg2git-marks --export-marks=.git/hg2git-marks --force

      - name: Optimize Git repository
        run: |
          cd hg-temp-git
          git gc --aggressive --prune=now

      - name: Push converted commits
        run: |
          cd hg-temp-git
          git push origin mercurial-sync --force

      - name: Save conversion state
        run: |
          cd hg-temp-git
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin mercurial-sync-meta || true
          git checkout --orphan temp-meta
          git rm -rf . 2>/dev/null || true
          cp .git/hg2git-marks . 2>/dev/null || true
          cp .git/hg2git-state . 2>/dev/null || true
          cp .git/hg2git-mapping . 2>/dev/null || true
          cp .git/hg2git-heads . 2>/dev/null || true
          git add hg2git-marks hg2git-state hg2git-mapping hg2git-heads 2>/dev/null || true
          git commit -m "Update conversion state" || true
          git push origin temp-meta:mercurial-sync-meta --force || true