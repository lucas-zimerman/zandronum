name: Daily Mercurial Sync

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Install Mercurial
        run: |
          sudo apt update
          sudo apt install -y mercurial git python3 python3-pip
          pip3 install dulwich

      - name: Checkout mercurial-sync branch
        uses: actions/checkout@v3
        with:
          ref: mercurial-sync
          fetch-depth: 0

      - name: Clone upstream Mercurial repo
        run: |
          rm -rf upstream-hg
          hg clone https://foss.heptapod.net/zandronum/zandronum-stable upstream-hg

      - name: Fetch previous Git commits
        run: |
          git fetch origin mercurial-sync
          git checkout mercurial-sync

      - name: Convert Mercurial to Git
        run: |
          git init hg-temp-git
          cd hg-temp-git
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch origin
          cd ..
          # Clone fast-export and run conversion
          git clone https://github.com/frej/fast-export.git
          cd hg-temp-git
          # Restore conversion state from mercurial-sync-meta branch (if exists)
          # This enables incremental conversion by telling hg-fast-export which commits were already converted
          # First check if all state files exist before attempting restore
          if git show origin/mercurial-sync-meta:hg2git-heads > /dev/null 2>&1 && \
             git show origin/mercurial-sync-meta:hg2git-marks > /dev/null 2>&1 && \
             git show origin/mercurial-sync-meta:hg2git-state > /dev/null 2>&1 && \
             git show origin/mercurial-sync-meta:hg2git-mapping > /dev/null 2>&1; then
            # All state files exist, restore them
            git show origin/mercurial-sync-meta:hg2git-marks > .git/hg2git-marks
            git show origin/mercurial-sync-meta:hg2git-state > .git/hg2git-state
            git show origin/mercurial-sync-meta:hg2git-mapping > .git/hg2git-mapping
            git show origin/mercurial-sync-meta:hg2git-heads > .git/hg2git-heads
            # Checkout the branch for incremental update
            git checkout -b mercurial-sync origin/mercurial-sync
          else
            # No complete state found, do fresh conversion
            # Remove any existing branch refs and state files
            git branch -D mercurial-sync 2>/dev/null || true
            git update-ref -d refs/remotes/origin/mercurial-sync 2>/dev/null || true
            rm -f .git/hg2git-marks .git/hg2git-state .git/hg2git-mapping .git/hg2git-heads
          fi
          # Use head2branch plugin to assign unnamed heads to a branch so their commits get converted.
          # This fixes tags like ST_0.97d-beta4.2 that point to commits on these unnamed heads.
          ../fast-export/hg-fast-export.sh -r ../upstream-hg -M mercurial-sync --force \
            --plugin head2branch=skulltag-dev,8148 \
            --plugin head2branch=skulltag-dev,8147 \
            --plugin head2branch=skulltag-dev,8146 \
            --plugin head2branch=skulltag-dev,8145 \
            --plugin head2branch=skulltag-dev,8144 \
            --plugin head2branch=skulltag-dev,8143 \
            --plugin head2branch=skulltag-dev,8142 \
            --plugin head2branch=skulltag-dev,8141 \
            --plugin head2branch=skulltag-dev,8140 \
            --plugin head2branch=skulltag-dev,8139

      - name: Optimize Git repository
        run: |
          cd hg-temp-git
          git gc --aggressive --prune=now

      - name: Push converted commits
        run: |
          cd hg-temp-git
          git push origin mercurial-sync --force

      - name: Save conversion state
        run: |
          cd hg-temp-git
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin mercurial-sync-meta || true
          git checkout --orphan temp-meta
          git rm -rf . 2>/dev/null || true
          cp .git/hg2git-marks . 2>/dev/null || true
          cp .git/hg2git-state . 2>/dev/null || true
          cp .git/hg2git-mapping . 2>/dev/null || true
          cp .git/hg2git-heads . 2>/dev/null || true
          git add hg2git-marks hg2git-state hg2git-mapping hg2git-heads 2>/dev/null || true
          git commit -m "Update conversion state" || true
          git push origin temp-meta:mercurial-sync-meta --force