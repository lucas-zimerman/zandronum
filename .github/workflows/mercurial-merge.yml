name: Sync to Mercurial

on:
  push:
    branches:
      - 'sync/**'

permissions:
  contents: write

jobs:
  sync-to-mercurial:
    runs-on: ubuntu-latest

    steps:
      - name: Install Mercurial
        run: |
          sudo apt-get update
          sudo apt-get install -y mercurial

      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream Mercurial repo
        run: |
          hg clone https://foss.heptapod.net/zandronum/zandronum-stable upstream-hg

      - name: Apply changes to Mercurial
        run: |
          HEAD_SHA=$(git rev-parse HEAD)

          # Get author info from the head commit
          AUTHOR_NAME=$(git log -1 --format='%an')
          AUTHOR_EMAIL=$(git log -1 --format='%ae')
          COMMIT_MSG=$(git log -1 --format='%B')

          # Get the merge base with master to create the diff
          MERGE_BASE=$(git merge-base origin/master HEAD)
          git diff ${MERGE_BASE} HEAD > /tmp/changes.patch

          cd upstream-hg

          # Configure Mercurial user
          echo "[ui]" > ~/.hgrc
          echo "username = ${AUTHOR_NAME} <${AUTHOR_EMAIL}>" >> ~/.hgrc

          # Apply the patch
          if [ -s /tmp/changes.patch ]; then
            patch -p1 < /tmp/changes.patch || {
              echo "Failed to apply patch"
              cat /tmp/changes.patch
              exit 1
            }

            # Add any new files, remove deleted files
            hg addremove

            # Commit with the original message
            hg commit -m "${COMMIT_MSG}"

            echo "Mercurial commit created:"
            hg log -l 1
          else
            echo "No changes to sync"
            exit 0
          fi

      - name: Push to Mercurial
        env:
          HG_USERNAME: ${{ secrets.HG_USERNAME }}
          HG_PASSWORD: ${{ secrets.HG_PASSWORD }}
        run: |
          cd upstream-hg

          echo "[auth]" >> ~/.hgrc
          echo "heptapod.prefix = foss.heptapod.net" >> ~/.hgrc
          echo "heptapod.username = ${HG_USERNAME}" >> ~/.hgrc
          echo "heptapod.password = ${HG_PASSWORD}" >> ~/.hgrc

          hg push || {
            echo "Failed to push to Mercurial"
            exit 1
          }

          echo "Successfully pushed to Mercurial!"

      - name: Delete sync branch
        run: |
          git push origin --delete "${GITHUB_REF_NAME}"
          echo "Deleted branch ${GITHUB_REF_NAME}"
